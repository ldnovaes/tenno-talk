# TENNO TALK: failed or limited sign-in, sign-up and password requests (PLAN.md §38).
# Installed as /etc/fail2ban/filter.d/tenno-auth.conf by provision.sh. fail2ban removes the
# timestamp before matching, hence the empty [].
[Definition]
failregex = ^<HOST> - \S+ \[\] "POST /api/auth/(?:signin|signup|password) HTTP/[\d.]+" (?:401|429) 
ignoreregex =
