# TENNO TALK jails (PLAN.md §38). Installed as /etc/fail2ban/jail.d/tenno-talk.conf by provision.sh.
# They read only TENNO's own logs; the jails of the other sites are untouched. Thresholds are high
# on purpose: carrier-grade NAT puts many phones behind one address.

[tenno-auth]
enabled  = true
port     = http,https
filter   = tenno-auth
logpath  = /var/log/nginx/tenno-talk.access.log
maxretry = 20
findtime = 10m
bantime  = 1h

[tenno-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/tenno-talk.error.log
maxretry = 30
findtime = 10m
bantime  = 1h
