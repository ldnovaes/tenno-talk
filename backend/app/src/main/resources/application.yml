spring:
  task:
    scheduling:
      # One thread per @Scheduled task (SchedulingPoolIT): a slow AI worker must never delay the realtime dispatch.
      pool:
        size: 12
  application:
    name: tenno-talk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenno}
    username: ${DATABASE_USER:tenno}
    password: ${DATABASE_PASSWORD:tenno}
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30d
  servlet:
    multipart:
      # No product limit on media (PLAN.md §34); a high technical ceiling protects the VPS (R15).
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Media has no product limit (R15): the public health turns DOWN before the disk is full,
    # so an external uptime monitor alerts in time.
    diskspace:
      path: ${tenno.media.root}
      threshold: ${DISK_ALERT_THRESHOLD:2GB}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    enabled: false

tenno:
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
  public-url: ${PUBLIC_URL:http://localhost:5173}
  terms-version: "2026-10-04"
  # Social login: a provider is offered only when its client id is set (OAuthClients).
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
  # Session cookie over HTTPS only (SessionCookieConfig); false only for local http development.
  cookie-secure: ${COOKIE_SECURE:true}
  media:
    root: ${MEDIA_ROOT:./data/media}
  translation:
    worker-enabled: ${TRANSLATION_WORKER_ENABLED:true}
    batch-size: 2
    max-attempts: 3
    context-messages: 8
    timeout: 60s
    cooldown-default: 15m
  ai:
    # OpenAI is the primary provider; Anthropic only when it fails (PLAN.md §28.1).
    # A provider without a key is not registered. Keys come from Infisical in production.
    max-output-tokens: 4096
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_TRANSLATION_MODEL:gpt-4.1-mini}
      base-url: ${OPENAI_BASE_URL:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_TRANSLATION_MODEL:claude-haiku-4-5}
      base-url: ${ANTHROPIC_BASE_URL:}
  rate-limit:
    enabled: true
  # Discover ranking (PLAN.md §37). Invalid values fall back to the defaults in DiscoverProperties.
  discover:
    page-size: 10
    session-size: 300
    candidate-limit: 500
    source-limit: 120
    window: 14d
    session-ttl: 30m
    rank-timeout: 250ms
    query-timeout: 2s
    affinity-half-life: 14d
    event-retention: 90d
    worker-enabled: ${DISCOVER_WORKER_ENABLED:true}
    worker-batch: 500
    ranking:
      budget: 30ms
      exposure-slots: 2
      exposure-block: 10
      min-impressions: 50
      exposure-window: 72h
      freshness-half-life: 24h
      contribution-cap: 10
      breaker-threshold: 5
      breaker-cooldown: 5m
    weights:
      topic: 3.0
      author: 2.0
      language: 1.5
      social: 1.5
      country: 0.5
      engagement: 1.0
      neighbors: 1.5
      exploration: 0.5
      negative: 3.0
      seen: 2.0
      author-gap: 4
      diversity: 0.5
