spring:
  application:
    name: tenno-talk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenno}
    username: ${DATABASE_USER:tenno}
    password: ${DATABASE_PASSWORD:tenno}
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30d
  servlet:
    multipart:
      # No product limit on media (PLAN.md §34); a high technical ceiling protects the VPS (R15).
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid,email,profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:unset}
            client-secret: ${FACEBOOK_CLIENT_SECRET:unset}
            scope: email,public_profile

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    enabled: false

tenno:
  public-url: ${PUBLIC_URL:http://localhost:5173}
  terms-version: "2026-10-03"
  # Session cookie over HTTPS only (SessionCookieConfig); false only for local http development.
  cookie-secure: ${COOKIE_SECURE:true}
  media:
    root: ${MEDIA_ROOT:./data/media}
  translation:
    worker-enabled: ${TRANSLATION_WORKER_ENABLED:true}
    batch-size: 2
    max-attempts: 3
    context-messages: 8
    timeout: 60s
    cooldown-default: 15m
  ai:
    # ChatGPT is the primary provider; Claude only when it fails (PLAN.md §28).
    providers:
      - id: codex
        command: ["codex", "exec", "--skip-git-repo-check", "{prompt}"]
        status-command: ["codex", "login", "status"]
        login-command: ["codex", "login", "--device-auth"]
      - id: claude
        command: ["claude", "-p", "{prompt}", "--output-format", "json"]
        status-command: ["claude", "auth", "status"]
        login-command: ["claude", "setup-token"]
    auth-error-patterns: ["not logged in", "login required", "unauthorized", "401", "authentication", "please run /login", "expired"]
    quota-error-patterns: ["usage limit", "rate limit", "429", "quota", "too many requests"]
  rate-limit:
    enabled: true
