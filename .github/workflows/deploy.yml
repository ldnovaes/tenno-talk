name: Deploy

# Manual: Actions → Deploy → Run workflow. Deploys the chosen ref to the VPS (deploy/VPS.md).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: true
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull and restart
        env:
          REF: ${{ inputs.ref }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s -- "$REF" <<'SCRIPT'
          set -euo pipefail
          cd /opt/tenno-talk
          git fetch --tags origin
          git checkout --force "$1"
          git pull --ff-only origin "$1" 2>/dev/null || true
          cd deploy
          docker compose up -d --build
          docker image prune -f
          for i in $(seq 1 60); do
            docker compose exec -T backend curl -fsS http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 5
          done
          echo "Backend did not become healthy" >&2
          docker compose logs --tail=100 backend
          exit 1
          SCRIPT
