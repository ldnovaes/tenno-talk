name: Recommender stress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recommender:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -pl recommender -Precommender-stress test
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommender-stress
          path: |
            backend/recommender/target/recommender-stress/
            backend/recommender/target/surefire-reports/
